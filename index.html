<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Hushållsbudget v11.2.1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="title">
    <h1>Hushållsbudget <span class="pill">v11.2.1</span></h1>
    <p class="subtitle">Fix: 🎯 rad‑knappar fungerar oavsett globalt budgetläge</p>
  </div>
  <div class="header-actions">
    <button id="budgetModeToggle" class="secondary" aria-label="Växla budgetläge">🎯 Budgetläge: OFF</button>
  </div>
</header>

<main>
  <section class="sec fixed">
    <h2>Exempelrad</h2>
    <div class="grid" id="fixedBaseGrid">
      <label class="cat" data-id="boende">🏠 Hyra/Bolån
        <input id="boende" type="text" inputmode="decimal">
        <div class="row-ctl">
          <button class="budgetCat" title="Budget ON/OFF">🎯</button>
        </div>
        <div class="row-extra">
          <span class="budget-wrap">🎯 Budget <input class="budget" type="text" inputmode="decimal" placeholder="kr"></span>
          <div class="row-budget"><div class="bar"><div></div></div><small class="txt">—</small></div>
        </div>
      </label>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
